<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 36 612 170" width="1224" height="340" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="grau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#555b62"/>
      <stop offset="1" stop-color="#32363b"/>
    </linearGradient>
    <linearGradient id="weiss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ebee"/>
    </linearGradient>
    <clipPath id="weissClip">
      <rect x="44" y="74" width="544" height="108"/>
    </clipPath>
    <!-- Kavität mit abgeschrägten Ecken (Mini-Fit Codierung) -->
    <g id="kav">
      <path d="M-15,-15 H15 V9 L9,15 H-9 L-15,9 Z" fill="#2b2e32"/>
      <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#b9bdc3"/>
      <rect x="-6" y="-6" width="12" height="4" rx="2" fill="#d8dbe0"/>
    </g>
    <!-- Eckpin: markiert, ohne Kontaktfläche (Platz für Pinnummer) -->
    <g id="kavE">
      <path d="M-15,-15 H15 V9 L9,15 H-9 L-15,9 Z" fill="#2b2e32" stroke="#e8590c" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </defs>


  <!-- Rastnasen (ragen aus dem Deckel heraus) -->
  <g fill="url(#weiss)" stroke="#8d939a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M164,82 L164,52 Q164,46 170,46 L202,46 Q208,46 208,52 L208,82 Z"/>
    <path d="M382,82 L382,52 Q382,46 388,46 L420,46 Q426,46 426,52 L426,82 Z"/>
    <path d="M512,82 L512,52 Q512,46 518,46 L550,46 Q556,46 556,52 L556,82 Z"/>
  </g>

  <!-- Dunkelgraues Kunststoffgehäuse -->
  <rect x="30" y="60" width="572" height="136" rx="34" fill="url(#grau)" stroke="#23262a" stroke-width="2"/>
  <rect x="34" y="63" width="564" height="10" rx="5" fill="#ffffff" opacity="0.08"/>

  <!-- Rastnasen nochmals im Vordergrund über dem Deckelrand -->
  <g fill="url(#weiss)" stroke="#8d939a" stroke-width="1.5" stroke-linejoin="round">
    <path d="M164,76 L164,52 Q164,46 170,46 L202,46 Q208,46 208,52 L208,76"/>
    <path d="M382,76 L382,52 Q382,46 388,46 L420,46 Q426,46 426,52 L426,76"/>
    <path d="M512,76 L512,52 Q512,46 518,46 L550,46 Q556,46 556,52 L556,76"/>
  </g>

  <!-- Weiße Buchsengehäuse, nahtlos nebeneinander -->
  <g clip-path="url(#weissClip)">
    <rect x="44" y="74" width="544" height="108" fill="url(#weiss)"/>
    <line x1="328" y1="74" x2="328" y2="182" stroke="#c3c7cc" stroke-width="1.5"/>
    <line x1="480" y1="74" x2="480" y2="182" stroke="#c3c7cc" stroke-width="1.5"/>
  </g>
  <rect x="44" y="74" width="544" height="108" fill="none" stroke="#b5bac0" stroke-width="1.5"/>

  <!-- J1: 12 Pins (2x6) – mittlere Pins normal, Eckpins markiert -->
  <g>
    <use href="#kav" x="120" y="106"/><use href="#kav" x="164" y="106"/>
    <use href="#kav" x="208" y="106"/><use href="#kav" x="252" y="106"/>
    <use href="#kav" x="120" y="150"/><use href="#kav" x="164" y="150"/>
    <use href="#kav" x="208" y="150"/><use href="#kav" x="252" y="150"/>
    <use href="#kavE" x="76" y="106"/><use href="#kavE" x="296" y="106"/>
    <use href="#kavE" x="76" y="150"/><use href="#kavE" x="296" y="150"/>
  </g>
  <!-- J2: 6 Pins (2x3) -->
  <g>
    <use href="#kav" x="404" y="106"/><use href="#kav" x="404" y="150"/>
    <use href="#kavE" x="360" y="106"/><use href="#kavE" x="448" y="106"/>
    <use href="#kavE" x="360" y="150"/><use href="#kavE" x="448" y="150"/>
  </g>
  <!-- J3: 4 Pins (2x2) – alle vier sind Eckpins -->
  <g>
    <use href="#kavE" x="512" y="106"/><use href="#kavE" x="556" y="106"/>
    <use href="#kavE" x="512" y="150"/><use href="#kavE" x="556" y="150"/>
  </g>

  <!-- Pinnummern der Eckpins (Pin 1 unten rechts; untere Reihe 1…n/2 von rechts nach links, obere Reihe n/2+1…n von rechts nach links) -->
  <g fill="#ffb347" font-size="16" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <!-- J1 -->
    <text x="76" y="107">12</text><text x="296" y="107">7</text>
    <text x="76" y="151">6</text><text x="296" y="151">1</text>
    <!-- J2 -->
    <text x="360" y="107">6</text><text x="448" y="107">4</text>
    <text x="360" y="151">3</text><text x="448" y="151">1</text>
    <!-- J3 -->
    <text x="512" y="107">4</text><text x="556" y="107">3</text>
    <text x="512" y="151">2</text><text x="556" y="151">1</text>
  </g>


  <!-- Bezeichnungen J1, J2, J3 auf den Rastnasen -->
  <g fill="#1f2328" font-size="18" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <text x="186" y="62">J1</text>
    <text x="404" y="62">J2</text>
    <text x="534" y="62">J3</text>
  </g>
</svg>
